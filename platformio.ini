; ESP32-2432S028R ("Cheap Yellow Display") touch-screen mini OS
;
; Display: ILI9341 320x240 on HSPI
; Touch:   XPT2046 on its own (VSPI) bus

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    ; --- TFT_eSPI configuration (replaces editing User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    ; Touch is handled by XPT2046_Touchscreen, not TFT_eSPI
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DILI9341_2_DRIVER=1
    ; If colours look inverted on your board, uncomment:
    ; -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
